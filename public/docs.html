<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Ticketing API docs</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Scalar renders /openapi.json as interactive docs. It runs in the browser
         only; the project itself still has no outside packages. -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.4/dist/browser/standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: '/openapi.json',
        // Pre-select the x-user-id header so "Test Request" works straight away.
        authentication: { preferredSecurityScheme: 'UserId' },
      });
    </script>
  </body>
</html>
